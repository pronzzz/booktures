[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "booktures"
version = "2.0.0"
description = "Turn any book into an illustrated visual novel, with the LLM and image model of your choice."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranav Dwivedi" }]
requires-python = ">=3.10"
keywords = ["books", "visual-novel", "stable-diffusion", "llm", "ollama", "illustration", "epub", "pdf"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Text Processing",
  "Environment :: Web Environment",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pymupdf>=1.24",
  "pillow>=10.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
local = ["torch>=2.2", "diffusers>=0.30", "transformers>=4.40", "accelerate>=0.30", "safetensors>=0.4"]
anthropic = ["anthropic>=0.70"]
ocr = ["pytesseract>=0.3.10"]
all = ["booktures[local,anthropic,ocr]"]
dev = ["pytest>=8", "booktures[anthropic]"]

[project.scripts]
booktures = "booktures.cli:main"

[project.urls]
Homepage = "https://github.com/pronzzz/booktures"
Issues = "https://github.com/pronzzz/booktures/issues"

[tool.hatch.build.targets.wheel]
packages = ["booktures"]
# The built web app is gitignored but must ship inside the wheel.
artifacts = ["booktures/web/**"]

[tool.hatch.build.targets.sdist]
include = ["booktures", "frontend", "plugins", "docs", "tests", "samples", "README.md", "LICENSE", "CHANGELOG.md"]
exclude = ["frontend/node_modules", "docs/screenshots"]
artifacts = ["booktures/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
